<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ app_title }}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico', v=app_version) }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css', v=app_version) }}">
</head>

<body>

<h1>{{ app_title }}</h1>

<img
    src="{{ url_for('static', filename='homelab-dashboard-logo.png', v=app_version) }}"
    alt="Homelab Dashboard"
    class="dashboard-logo"
>

<div class="version">Version {{ app_version }}</div>

<div class="cpu">
    🌡️ CPU:
    <strong id="cpu-temp">{{ cpu_temp }}</strong>
</div>

<div class="ups" id="ups-card" style="display:none;">

    <h3>⚡ UPS</h3>

    <table>
        <tr><td>Status</td><td id="ups-status">-</td></tr>
        <tr><td>Batéria</td><td id="ups-battery">-</td></tr>
        <tr><td>Runtime</td><td id="ups-runtime">-</td></tr>
        <tr><td>Zaťaženie</td><td id="ups-load">-</td></tr>
    </table>

</div>

{% for device in devices %}

<div class="device">

    <button
        id="wake-{{ device.id }}"
        class="wake-button"
        data-device-id="{{ device.id }}">
        Zapnúť {{ device.name }}
    </button>

    <div
        id="status-{{ device.id }}"
        class="status {% if device.online %}online{% else %}offline{% endif %}">
        {% if device.online %}
            🟢 Online
        {% else %}
            🔴 Offline
        {% endif %}
    </div>

</div>

{% endfor %}

<div class="logout">
    <a href="{{ url_for('logout') }}">
        Odhlásiť
    </a>
</div>

<script src="{{ url_for('static', filename='js/dashboard.js', v=app_version) }}"></script>

</body>
</html>
