<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ app_title }}</title>

    <style>
        body {
            margin: 0;
            background: #121212;
            color: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: #1e1e1e;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.45);
            width: 340px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 5px;
        }

        .version {
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-bottom: 14px;
            font-size: 16px;

            background: #2b2b2b;
            color: white;

            border: 1px solid #444;
            border-radius: 8px;

            outline: none;
            transition: border-color .2s;
        }

        input:focus {
            border-color: #2196f3;
        }

        input::placeholder {
            color: #999;
        }

        button {
            width: 100%;
            padding: 13px;

            font-size: 16px;

            background: #2196f3;
            color: white;

            border: none;
            border-radius: 8px;

            cursor: pointer;

            transition: background .2s;
        }

        button:hover {
            background: #1976d2;
        }

        .error {
            margin-top: 18px;
            color: #ff6b6b;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>{{ app_title }}</h1>
    <div class="version">Version {{ app_version }}</div>

    <form method="post">

        <input
            type="text"
            name="username"
            placeholder="Používateľské meno"
            required
            autofocus
        >

        <input
            type="password"
            name="password"
            placeholder="Heslo"
            required
        >

        <button type="submit">
            Prihlásiť
        </button>

    </form>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>
</html>
